<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}}</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--app-->
<div class="wrap" id="app">
  <header class="bar" id="bar">
    <div class="mark">
      <svg viewBox="-9 -9 18 18" aria-hidden="true"><circle class="sun" r="8.5"/><circle class="shadow" cx="2.5" cy="-1.5" r="2.6"/></svg>
      <span id="wordmark">{{name}}</span>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="tally" id="tally"></div>
    <span class="tools" id="tools">
      <button class="tool" data-act="share" aria-label="Copy this night as an image" title="Copy this night as an image (C)" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path class="arrow" d="M7 9V1.6M4.3 4.2 7 1.5l2.7 2.7M2.5 7.6v4.9h9V7.6"/><path class="ok" d="M2.5 7.4l3 3 6-6.4"/></svg></button>
      <button class="tool" data-act="minimal" aria-label="Minimal view" title="Minimal view (M)"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.6"/><circle class="dot" cx="8.7" cy="5.9" r="1.5"/></svg></button>
      <button class="tool" data-act="full" aria-label="Full screen" title="Full screen (F)" hidden><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
    </span>
  </header>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <main class="hero" id="hero"></main>
  <section class="month">
    <div class="month-head"><span class="month-left"><span class="label" id="month-title">Nights</span><span class="label" id="month-note"></span></span><button class="go small" id="open-log">All nights<span>→</span></button></div>
    <div class="strip boot" id="strip"></div>
  </section>
  <footer class="foot"><span>MicroObservatory frames · ExoClock and NASA Exoplanet Archive ephemerides</span><span id="version"></span></footer>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="ambient" id="ambient" hidden></div>
<div class="upload" id="upload" hidden></div>
<!--/app-->
<div class="splash" id="splash" aria-hidden="true"><div class="s-star"><i></i></div><div class="s-name">{{name}}</div></div>
<script src="app.js"></script>
</body>
</html>
