name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      # The suite is written to run offline: every network call, the
      # EXOTIC subprocess and the browser are stubbed by the tests
      # themselves (monkeypatch), and all data files are synthesised
      # in pytest's tmp_path. No secrets or external data are needed.
      - name: Run the test suite
        run: python -m pytest tests -q
